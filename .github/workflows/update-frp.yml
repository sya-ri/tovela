name: Update FRP

on:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency: update-frp

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read and pin the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api repos/fatedier/frp/releases/latest | bash scripts/update-frp.sh
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          branch: update-frp
          delete-branch: true
          add-paths: internal/frprelease/release.go
          sign-commits: true
          commit-message: 'chore(deps): Update FRP'
          title: 'chore(deps): Update FRP'
          body: |
            Update the pinned FRP client and server to the latest stable release.
            Refresh the SHA-256 digests for all supported release archives.
