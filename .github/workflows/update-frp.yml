name: Update FRP

on:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency: update-frp

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read and pin the latest stable release
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/fatedier/frp/releases/latest | bash scripts/update-frp.sh
          if ! git diff --quiet -- internal/frprelease/release.go; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check update credentials
        id: credentials
        if: steps.pin.outputs.changed == 'true'
        env:
          FRP_UPDATE_TOKEN: ${{ secrets.FRP_UPDATE_TOKEN }}
        run: |
          if [[ -n "$FRP_UPDATE_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "A new FRP release is ready in the frp-release-pin artifact. Set a repository-scoped FRP_UPDATE_TOKEN to open update pull requests." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save the updated pin
        if: steps.pin.outputs.changed == 'true' && steps.credentials.outputs.configured != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frp-release-pin
          path: internal/frprelease/release.go
          if-no-files-found: error
      - name: Open a pull request
        if: steps.credentials.outputs.configured == 'true'
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ secrets.FRP_UPDATE_TOKEN }}
          branch: update-frp
          delete-branch: true
          add-paths: internal/frprelease/release.go
          sign-commits: true
          commit-message: 'chore(deps): Update FRP'
          title: 'chore(deps): Update FRP'
          body: |
            Update the pinned FRP client and server to the latest stable release.
            Refresh the SHA-256 digests for all supported release archives.
