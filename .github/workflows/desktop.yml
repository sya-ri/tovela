name: Desktop

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
        with:
          version: '2026.11.14'
      - name: Install Windows build dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          C:/msys64/usr/bin/bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:/msys64/ucrt64/bin' >> $env:GITHUB_PATH
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - run: go run ./scripts
      - if: matrix.platform == 'windows'
        run: ./internal/relay/bin/frpc.exe --version
      - if: matrix.platform != 'windows'
        run: ./internal/relay/bin/frpc --version
      - shell: pwsh
        run: Copy-Item LICENSE build/LICENSE
      - run: go test -tags ci ./...
      - name: Build the desktop app
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          CLOUDFLARE_OAUTH_CLIENT_ID: ${{ vars.CLOUDFLARE_OAUTH_CLIENT_ID }}
        run: |
          $flags = @('-s', '-w')
          if ($env:GOOGLE_OAUTH_CLIENT_ID -match '^[a-zA-Z0-9._-]+$') {
            $flags += '-X', "main.googleOAuthClientID=$env:GOOGLE_OAUTH_CLIENT_ID"
          }
          if ($env:CLOUDFLARE_OAUTH_CLIENT_ID -match '^[a-zA-Z0-9._-]+$') {
            $flags += '-X', "main.cloudflareOAuthClientID=$env:CLOUDFLARE_OAUTH_CLIENT_ID"
          }
          switch ($env:RUNNER_OS) {
            'Windows' { $output = 'build/Tovela.exe'; $flags += '-H=windowsgui' }
            'Linux' { $output = 'build/tovela' }
            'macOS' {
              New-Item -ItemType Directory -Path build/Tovela.app/Contents/MacOS -Force | Out-Null
              Copy-Item scripts/macos-info.plist build/Tovela.app/Contents/Info.plist
              $output = 'build/Tovela.app/Contents/MacOS/Tovela'
            }
          }
          go build -trimpath "-ldflags=$($flags -join ' ')" -o $output .
      - if: matrix.platform != 'windows'
        run: tar -czf "tovela-${{ matrix.platform }}.tar.gz" -C build .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tovela-${{ matrix.platform }}
          path: |
            tovela-${{ matrix.platform }}.tar.gz
            build/*.exe
            build/frp-LICENSE
            build/LICENSE
          if-no-files-found: error
