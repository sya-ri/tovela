      <path d="M58 276L553 -821.10" stroke="#aa3d72"/>
      <path d="M58 276L553 233.66" stroke="#8250df" stroke-dasharray="1 5" stroke-linecap="round"/>
    </g>
    <g font-size="13">
      <text x="584" y="29" font-size="14" font-weight="600">Tovela (us-central1)</text>
