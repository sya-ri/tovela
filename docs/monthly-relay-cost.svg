    <path d="M58 24V276H553" stroke="#afb8c1" fill="none"/>
    <g text-anchor="end" font-size="14" fill="#57606a">
      <text x="46" y="281">$0</text>
      <text x="46" y="239">$2</text>
      <text x="46" y="197">$4</text>
      <text x="46" y="155">$6</text>
      <text x="46" y="113">$8</text>
      <text x="46" y="71">$10</text>
      <text x="46" y="29">$12</text>
    </g>
    <g text-anchor="middle" font-size="14" fill="#57606a">
      <text x="58" y="301">0 h</text>
      <text x="181.75" y="301">180 h</text>
      <text x="305.50" y="301">360 h</text>
      <text x="429.25" y="301">540 h</text>
      <text x="553" y="301">720 h</text>
    </g>
    <g stroke="#8a5d2c" stroke-width="1.7" stroke-dasharray="7 4" fill="none">
