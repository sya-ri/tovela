<svg xmlns="http://www.w3.org/2000/svg" width="850" height="318" viewBox="0 0 850 318" role="img" aria-labelledby="title desc">
  <title id="title">Monthly relay costs by hours online</title>
  <desc id="desc">The chart shows costs up to $12 for a 720-hour month. Tovela lines use Iowa rates for four machine types with disk and public IPv4. e2-micro has 0.25 sustained vCPU, 1 GiB RAM, and up to 1 Gbps egress. e2-small has 0.5 sustained vCPU, 2 GiB RAM, and up to 1 Gbps egress. e2-medium has 1 sustained vCPU, 4 GiB RAM, and up to 2 Gbps egress. e2-standard-2 has 2 vCPUs, 8 GiB RAM, and up to 4 Gbps egress. One Localtonet tunnel is billed hourly. Monthly base prices are $3 for Playit Premium and Pinggy Pro, $8 for LocalXpose Pro billed annually, and $10 for ngrok Hobbyist.</desc>
  <defs>
    <clipPath id="plot">
      <rect x="58" y="24" width="496" height="253"/>
    </clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="849" height="317" rx="12" fill="#fff" stroke="#d0d7de"/>
  <g font-family="system-ui, sans-serif" fill="#24292f">
