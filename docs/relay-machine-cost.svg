<svg xmlns="http://www.w3.org/2000/svg" width="850" height="241" viewBox="0 0 850 241" role="img" aria-labelledby="title desc">
  <title id="title">Tovela relay costs at 100 hours per month</title>
  <desc id="desc">Iowa on-demand estimates with a 10 GiB standard disk and public IPv4. e2-micro provides 0.25 sustained vCPU, 1 GiB RAM, and up to 1 Gbps egress, and costs $1.39. e2-small provides 0.5 sustained vCPU, 2 GiB RAM, and up to 1 Gbps egress, and costs $2.23. e2-medium provides 1 sustained vCPU, 4 GiB RAM, and up to 2 Gbps egress, and costs $3.91. e2-standard-2 provides 2 sustained vCPUs, 8 GiB RAM, and up to 4 Gbps egress, and costs $7.26.</desc>
  <rect x="0.5" y="0.5" width="849" height="240" rx="12" fill="#fff" stroke="#d0d7de"/>
  <g font-family="system-ui, sans-serif" fill="#24292f">
    <g font-size="13" font-weight="600" fill="#57606a">
      <text x="24" y="28">Sustained CPU / RAM / max egress</text>
      <text x="272" y="28">Cost at 100 h per month</text>
    </g>
    <path d="M272 40V206 M396 40V206 M520 40V206 M644 40V206 M768 40V206" stroke="#d8dee4" fill="none"/>
    <g fill="#087763">
      <rect x="272" y="48" width="86.18" height="16" rx="4"/>
      <rect x="272" y="91" width="138.26" height="16" rx="4"/>
      <rect x="272" y="134" width="242.42" height="16" rx="4"/>
      <rect x="272" y="177" width="450.12" height="16" rx="4"/>
    </g>
    <g font-size="14" font-weight="600">
      <text x="24" y="54">e2-micro (default)</text>
      <text x="24" y="97">e2-small</text>
      <text x="24" y="140">e2-medium</text>
      <text x="24" y="183">e2-standard-2</text>
      <g fill="#076755">
        <text x="367" y="61">$1.39</text>
        <text x="419" y="104">$2.23</text>
        <text x="523" y="147">$3.91</text>
        <text x="731" y="190">$7.26</text>
      </g>
    </g>
    <g font-size="13" fill="#57606a">
      <text x="24" y="71">0.25 vCPU, 1 GiB, 1 Gbps</text>
      <text x="24" y="114">0.5 vCPU, 2 GiB, 1 Gbps</text>
      <text x="24" y="157">1 vCPU, 4 GiB, 2 Gbps</text>
      <text x="24" y="200">2 vCPUs, 8 GiB, 4 Gbps</text>
      <g text-anchor="middle">
        <text x="272" y="225">$0</text>
        <text x="396" y="225">$2</text>
        <text x="520" y="225">$4</text>
        <text x="644" y="225">$6</text>
        <text x="768" y="225">$8</text>
      </g>
    </g>
  </g>
</svg>